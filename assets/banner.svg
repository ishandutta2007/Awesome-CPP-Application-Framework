<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00599C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#659AD2" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .orb-1 { animation: pulse 6s ease-in-out infinite; transform-origin: 200px 180px; }
    .orb-2 { animation: pulse 8s ease-in-out infinite 1s; transform-origin: 1000px 180px; }
    .card-float-1 { animation: float1 5s ease-in-out infinite; }
    .card-float-2 { animation: float2 6s ease-in-out infinite 0.5s; }
    .grid-line { stroke: #334155; stroke-width: 1; opacity: 0.3; }
    .connecting-line { stroke: #38bdf8; stroke-width: 1.5; opacity: 0.4; stroke-dasharray: 6 6; animation: dash 3s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs -->
  <circle class="orb-1" cx="200" cy="180" r="160" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle class="orb-2" cx="1000" cy="180" r="140" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Decorative Tech Grid Lines -->
  <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />

  <!-- Dynamic Animated Tech Connections (Background Behind Text) -->
  <path d="M 150 70 L 350 70 L 450 140 L 750 140 L 850 70 L 1050 70" fill="none" class="connecting-line" />
  <path d="M 100 290 L 300 290 L 400 220 L 800 220 L 900 290 L 1100 290" fill="none" class="connecting-line" />

  <!-- Background Tech Badges (Floating Cards) -->
  <g class="card-float-1" opacity="0.4">
    <rect x="70" y="50" width="130" height="36" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <text x="135" y="73" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">GUI Toolkits</text>
  </g>

  <g class="card-float-2" opacity="0.4">
    <rect x="1000" y="50" width="130" height="36" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
    <text x="1065" y="73" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cross-Platform</text>
  </g>

  <g class="card-float-2" opacity="0.4">
    <rect x="70" y="270" width="130" height="36" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" />
    <text x="135" y="293" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Audio &amp; Graphics</text>
  </g>

  <g class="card-float-1" opacity="0.4">
    <rect x="1000" y="270" width="130" height="36" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" />
    <text x="1065" y="293" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Immediate-Mode</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <!-- C++ Logo Emblem -->
  <g transform="translate(600, 75)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#00599C" stroke="#659AD2" stroke-width="2"/>
    <text x="0" y="7" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">C++</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="1" text-anchor="middle" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.8))">
    Awesome C++ Application Framework
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5" text-anchor="middle">
    A Curated Ecosystem of Commercial Products &amp; Open-Source C++ Frameworks
  </text>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(600, 260)">
    <g transform="translate(-250, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Native Performance</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="0" y="4" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💻 Desktop UI</text>
    </g>
    <g transform="translate(80, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="0" y="4" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Embedded UI</text>
    </g>
    <g transform="translate(250, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="0" y="4" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎵 Audio &amp; Media</text>
    </g>
  </g>
</svg>
